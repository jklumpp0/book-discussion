name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check bootJar

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # GitHub has no API to change package visibility, so new packages stay private until set public once in the UI.
      - name: Check image is publicly pullable
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.version }}
        run: |
          repo=$(echo "$REPO" | tr '[:upper:]' '[:lower:]')
          token=$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | jq -r .token) &&
            curl -fsS -o /dev/null -H "Authorization: Bearer $token" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json" \
              "https://ghcr.io/v2/${repo}/manifests/${TAG}" ||
            echo "::warning::ghcr.io/${repo} is not public yet. Set it once at https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/${repo#*/}/settings (Danger Zone → Change visibility → Public)."

      - name: Package deploy bundle
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
        run: |
          bundle=october-discussion
          mkdir -p "$bundle/data"
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          sed "s|__IMAGE__|$image|" deploy/docker-compose.yml > "$bundle/docker-compose.yml"
          cp deploy/README.md "$bundle/README.md"
          tar czf "october-discussion-deploy-${{ steps.meta.outputs.version }}.tgz" "$bundle"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" october-discussion-deploy-*.tgz --generate-notes
